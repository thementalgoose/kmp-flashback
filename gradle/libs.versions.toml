[versions]
# Kotlin
kotlin = "2.3.21"
ksp = "2.3.7"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.7.1"
kotlinx-coroutines = "1.10.2"

# Android
agp = "9.2.0"
android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"
androidx-activityCompose = "1.13.0"
androidx-lifecycle = "2.10.0"
androidx-glance = "1.1.1"
androidx-xr = "1.0.0-alpha05"

# Firebase
google-services = "4.4.2"
crashlytics = "3.0.4"
firebase-bom = "34.12.0"

# Shared
ktor = "3.4.3"
okhttp = "5.3.2"
compose = "1.10.3"
composeAdaptive = "1.2.0"
composeNavigation = "2.9.2"
composeNav3 = "1.0.0-alpha06"
koin = "4.2.1"
room = "2.8.4"
sqlite = "2.6.2"
coil = "3.4.0"
ksoup = "0.6.0"
cmptoast = "1.0.8"

# Testing
mokkery = "3.3.0"
turbine = "1.2.1"
androidx-test-junit = "1.3.0"

[libraries]
# Kotlin
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-dateTime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

# Dependency Injection
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-compose-viewmodel-navigation = { module = "io.insert-koin:koin-compose-viewmodel-navigation", version.ref = "koin" }

# Android
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx_glance_core = { module = "androidx.glance:glance", version.ref = "androidx-glance" }
androidx_glance_preview = { module = "androidx.glance:glance-preview", version.ref = "androidx-glance" }
androidx_glance_appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "androidx-glance" }
androidx_glance_appwidgetpreview = { module = "androidx.glance:glance-appwidget-preview", version.ref = "androidx-glance" }
androidx_splashscreen = "androidx.core:core-splashscreen:1.2.0"
android_flagkit = "com.github.murgupluoglu:flagkit-android:1.0.5"
androidx_core = "androidx.core:core-ktx:1.18.0"
androidx_appcompat = "androidx.appcompat:appcompat:1.7.1"
androidx_browser = "androidx.browser:browser:1.10.0"
androidx_webkit = "androidx.webkit:webkit:1.15.0"

androidx_xr_runtime = { module = "androidx.xr.runtime:runtime", version.ref = "androidx-xr" }
androidx_xr_scenecore = { module = "androidx.xr.scenecore:scenecore", version.ref = "androidx-xr" }
androidx_xr_compose = { module = "androidx.xr.compose:compose", version.ref = "androidx-xr" }
androidx_xr_arcore = { module = "androidx.xr.arcore:arcore", version.ref = "androidx-xr" }

androidx_xr_extensions = "com.android.extensions.xr:extensions-xr:1.3.0"

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-remoteconfig = { module = "com.google.firebase:firebase-config" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-installations = { module = "com.google.firebase:firebase-installations" }

# Compose
compose-nav3 = "org.jetbrains.androidx.navigation3:navigation3-ui:1.0.0-alpha06"
compose-nav3Adaptive = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3:1.3.0-alpha02"
compose-nav3ViewModel = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3:2.10.0"

compose-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "composeAdaptive" }
compose-adaptivelayout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "composeAdaptive" }
compose-adaptivenavigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "composeAdaptive" }
compose-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose"}

compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose" }
compose-material3 = "org.jetbrains.compose.material3:material3:1.9.0"
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-materialIconsExtended = "org.jetbrains.compose.material:material-icons-extended:1.7.3"
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }

# Navigation
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "composeNavigation"}

# Database
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# Flags
flagkit = "dev.carlsen.flagkit:flagkit:1.1.0"

# HTML
ksoup = { module = "com.mohamedrejeb.ksoup:ksoup-html", version.ref = "ksoup" }

# CMP Toast
cmptoast = { module = "network.chaintech:cmptoast", version.ref = "cmptoast" }

# Coil
coil_compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil_network_ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# Networking
ktor-client-okHttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-serialization-kotlinx-xml = { module = "io.ktor:ktor-serialization-kotlinx-xml", version.ref = "ktor" }
okhttp-loggingInterceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-dnsoverhttps = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp"}

# Test
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-ui-test-manifest = "androidx.compose.ui:ui-test-manifest:1.10.5"

# Gradle Plugins
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[bundles]
androidx_glance = [
    "androidx_glance_core",
    "androidx_glance_appwidget",
    "androidx_glance_preview",
    "androidx_glance_appwidgetpreview",
]
androidx_xr = [
    "androidx_xr_runtime",
    "androidx_xr_scenecore",
    "androidx_xr_compose",
    "androidx_xr_arcore"
]
kotlin = [
    "kotlinx-dateTime",
    "coroutines-core",
    "kotlinx-serialization"
]
compose = [
    "compose-adaptive",
    "compose-adaptivelayout",
    "compose-adaptivenavigation",
    "compose-backhandler"
]
koin-compose = [
    "koin-compose",
    "koin-compose-viewmodel",
    "koin-compose-viewmodel-navigation"
]
common-ktor = [
    "ktor-client-core",
    "ktor-client-logging",
    "ktor-client-cio",
    "ktor-client-content-negotiation",
]
coil = [
    "coil_compose",
    "coil_network_ktor3"
]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
googleServices = { id = "com.google.gms.google-services" }
crashlytics = { id = "com.google.firebase.crashlytics" }
mokkery = {id = "dev.mokkery", version.ref = "mokkery"}
kotlinCocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }

# Custom Gradle Plugins
flashback-kotlinMultiplatform = { id = "tmg.flashback.kotlin.multiplatform" }
flashback-featureModule = { id = "tmg.flashback.feature.module" }
flashback-composeMultiplatform = { id = "tmg.flashback.compose.multiplatform" }
