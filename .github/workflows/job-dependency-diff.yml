name: Dependency Diff Report

on:
  workflow_call:

jobs:
  dependency_diff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Checkout
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Check the deps files
      - name: Check dependency files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - '**/libs.versions.toml'
              - '**/build.gradle.kts'

      # Setup Java 21
      - uses: actions/setup-java@v6
        if: steps.filter.outputs.changed == 'true'
        with:
          distribution: 'zulu'
          java-version: '21'

      # Caching gradle
      - uses: actions/cache@v6
        if: steps.filter.outputs.changed == 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/*.toml*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Environment
      - name: Environment variables
        if: steps.filter.outputs.changed == 'true'
        env:
          GOOGLE_SERVICES_JSON_SANDBOX: ${{ secrets.GOOGLE_SERVICES_JSON_SANDBOX }}
          GOOGLE_SERVICES_PLIST_SANDBOX: ${{ secrets.GOOGLE_SERVICES_PLIST_SANDBOX }}
        run: |
          mkdir -p androidApp/src/sandbox
          mkdir -p androidApp/src/production
          mkdir -p iosApp/iosApp/Firebase
          echo $GOOGLE_SERVICES_JSON_SANDBOX | base64 --decode >> androidApp/src/sandbox/google-services.json
          echo $GOOGLE_SERVICES_PLIST_SANDBOX | base64 --decode >> iosApp/iosApp/Firebase/GoogleService-sandbox.plist

      # Generating before app dependency output
      - name: Checkout base branch + generate report
        if: steps.filter.outputs.changed == 'true'
        run: |
          git checkout ${{ github.base_ref }}
          ./gradlew :androidApp:dependencies --configuration productionReleaseRuntimeClasspath >> before.txt

      # Generating after app dependency output
      - name: Checkout head branch + generate report
        if: steps.filter.outputs.changed == 'true'
        run: |
          git checkout ${{ github.head_ref }}
          ./gradlew :androidApp:dependencies --configuration productionReleaseRuntimeClasspath >> after.txt

      # Generating diff
      - name: Generate dependency diff
        id: diff
        if: steps.filter.outputs.changed == 'true'
        uses: thementalgoose/gradle-dependency-diff@v2
        with:
          before: before.txt
          after: after.txt
          post_pr_comment: true
          show_removals: false
