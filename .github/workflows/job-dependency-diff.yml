name: Job - Dependency Diff

on:
  workflow_call:

jobs:
  dependency_diff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Checkout
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Setup Java 17
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Caching gradle
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/*.toml*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Environment
      - name: Environment variables
        env:
          GOOGLE_SERVICES_JSON_SANDBOX: ${{ secrets.GOOGLE_SERVICES_JSON_SANDBOX }}
          GOOGLE_SERVICES_PLIST_SANDBOX: ${{ secrets.GOOGLE_SERVICES_PLIST_SANDBOX }}
        run: |
          mkdir -p composeApp/src/sandbox
          mkdir -p composeApp/src/production
          mkdir -p iosApp/iosApp/Firebase
          echo $GOOGLE_SERVICES_JSON_SANDBOX | base64 --decode >> composeApp/src/sandbox/google-services.json
          echo $GOOGLE_SERVICES_PLIST_SANDBOX | base64 --decode >> iosApp/iosApp/Firebase/GoogleService-sandbox.plist

      # Generating before app dependency output
      - name: Checkout base branch + generate report
        run: |
          git checkout ${{ github.base_ref }}
          ./gradlew :composeApp:dependencies --configuration productionReleaseRuntimeClasspath >> before.txt

      # Generating after app dependency output
      - name: Checkout head branch + generate report
        run: |
          git checkout ${{ github.head_ref }}
          ./gradlew :composeApp:dependencies --configuration productionReleaseRuntimeClasspath >> after.txt

      # Generating diff
      - name: Generate dependency diff
        id: diff
        uses: thementalgoose/gradle-dependency-diff@v2
        with:
          before: before.txt
          after: after.txt
          post_pr_comment: true
          show_removals: false
