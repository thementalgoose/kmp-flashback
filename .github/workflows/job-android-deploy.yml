name: Android Deploy

on:
  workflow_call:
    inputs:
      version_name: { required: true, type: string }
      version_code: { required: true, type: string }
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      # Checkout
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Setup Java 21
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # Caching gradle
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/*.toml*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Environment
      - name: Environment variables
        env:
          GOOGLE_SERVICES_JSON_PRODUCTION: ${{ secrets.GOOGLE_SERVICES_JSON_PRODUCTION }}
          GOOGLE_SERVICES_PLIST_PRODUCTION: ${{ secrets.GOOGLE_SERVICES_PLIST_PRODUCTION }}
        run: |
          mkdir -p androidApp/src/sandbox
          mkdir -p androidApp/src/production
          mkdir -p iosApp/iosApp/Firebase
          echo $GOOGLE_SERVICES_JSON_PRODUCTION | base64 --decode >> androidApp/src/production/google-services.json
          echo $GOOGLE_SERVICES_PLIST_PRODUCTION | base64 --decode >> iosApp/iosApp/Firebase/GoogleService-production.plist

      # Building version
      - name: Building version
        run: |
          echo Version name: ${{ inputs.version_name }}
          echo Version code: ${{ inputs.version_code }}

      # Assemble AAB
      - name: Assemble APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew :androidApp:assembleProductionRelease

      # Assemble AAB
      - name: Assemble bundle
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew :androidApp:bundleProductionRelease

      # Sign AAB
      - name: Sign app
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: androidApp/build/outputs/bundle/productionRelease
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE }}
          alias: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      # Sign APK
      - name: Sign app
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: androidApp/build/outputs/apk/production/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE }}
          alias: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      # Upload signed artifact info
      - name: Upload artifact info
        uses: actions/upload-artifact@v7
        with:
          name: AAB
          path: |
            androidApp/build/outputs/bundle/**/*.aab
            androidApp/build/outputs/apk/**/*.apk
            androidApp/build/outputs/mapping/**/mapping.txt

      # Deploy
      - name: Deploy Bundle to google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT }}
          packageName: tmg.flashback
          releaseFiles: androidApp/build/outputs/bundle/**/*.aab
          track: internal
          whatsNewDirectory: release-notes
          status: "completed"
          mappingFile: androidApp/build/outputs/mapping/productionRelease/mapping.txt

      # Rename signed APK
      - name: Rename signed apk
        run: |
          mv androidApp/build/outputs/apk/production/release/androidApp-production-release-unsigned-signed.apk androidApp/build/outputs/apk/production/release/android.apk
          mv androidApp/build/outputs/bundle/productionRelease/androidApp-production-release.aab androidApp/build/outputs/bundle/productionRelease/android.aab

      # Add artifact to tag
      - name: Upload file to github tag
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            androidApp/build/outputs/apk/production/release/android.apk
            androidApp/build/outputs/bundle/productionRelease/android.aab