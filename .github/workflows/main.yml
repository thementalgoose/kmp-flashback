name: Main
'on':
  push:
    branches:
      - main
    paths:
      - '**/*.gradle'
      - '**/*.toml'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - '**/main.yml'
jobs:
  unit-tests:
    uses: ./.github/workflows/job-unit-tests.yml
    secrets: inherit

  ui-test:
    uses: ./.github/workflows/job-android-uitest.yml
    secrets: inherit